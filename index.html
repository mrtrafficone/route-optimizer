<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Stop Route Optimizer</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100%; min-height: 400px; }
    </style>
</head>
<body class="bg-gray-100 font-sans h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">Multi-Stop Route Optimizer</h1>
        <span class="text-sm bg-blue-700 px-3 py-1 rounded-full">Supports 3 - 200 Locations</span>
    </header>

    <!-- Main Content Container -->
    <div class="flex flex-col md:flex-row flex-1 overflow-hidden">
        
        <!-- Sidebar Controls -->
        <div class="w-full md:w-96 bg-white p-4 overflow-y-auto shadow-lg flex flex-col gap-4 z-10">
            
            <!-- Search / Add Location Section -->
            <div class="border p-3 rounded-lg bg-gray-50 flex flex-col gap-3">
                <h2 class="font-semibold text-gray-700">Add Location</h2>
                
                <div>
                    <label class="text-xs text-gray-500 font-medium">Query (e.g., Chick-fil-A)</label>
                    <input type="text" id="searchQuery" placeholder="Location name or address" class="w-full border p-2 rounded text-sm mt-1">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs text-gray-500 font-medium">City</label>
                        <input type="text" id="searchCity" placeholder="City" class="w-full border p-2 rounded text-sm mt-1">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 font-medium">State / Country</label>
                        <input type="text" id="searchState" placeholder="State/Country" class="w-full border p-2 rounded text-sm mt-1">
                    </div>
                </div>

                <button onclick="searchAndAddLocation()" class="bg-blue-600 hover:bg-blue-700 text-white p-2 rounded text-sm font-medium transition cursor-pointer">
                    Search & Add
                </button>
            </div>

            <!-- Options -->
            <div class="flex items-center gap-2">
                <input type="checkbox" id="roundTrip" checked class="w-4 h-4 text-blue-600">
                <label for="roundTrip" class="text-sm font-medium text-gray-700">Round Trip (Return to Start)</label>
            </div>

            <!-- Locations List -->
            <div class="flex-1 flex flex-col">
                <div class="flex justify-between items-center mb-1">
                    <h2 class="font-semibold text-gray-700 text-sm">Destinations (<span id="locationCount">0</span>/200)</h2>
                    <button onclick="clearAllLocations()" class="text-red-500 hover:text-red-700 text-xs font-medium cursor-pointer">Clear All</button>
                </div>
                <div id="locationList" class="border rounded-lg bg-gray-50 flex-1 min-h-[150px] max-h-60 overflow-y-auto p-2 flex flex-col gap-2">
                    <p class="text-gray-400 text-xs text-center mt-6">No locations added yet.</p>
                </div>
            </div>

            <!-- Optimize Button -->
            <button onclick="optimizeRoute()" class="bg-green-600 hover:bg-green-700 text-white p-3 rounded-lg font-bold text-center transition cursor-pointer">
                Find Fastest Route
            </button>

            <!-- Route Summary -->
            <div id="routeSummary" class="hidden border p-3 rounded-lg bg-blue-50 text-xs text-blue-900 flex flex-col gap-1">
                <span class="font-bold">Route Summary:</span>
                <span id="summaryText">Calculated distance and time will appear here.</span>
            </div>
        </div>

        <!-- Map Container -->
        <div class="flex-1 relative">
            <div id="map"></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize Map centered on US
        const map = L.map('map').setView([39.8283, -98.5795], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let locations = [];
        let markers = [];
        let routeLayer = null;

        // Add searched location using Nominatim API
        async function searchAndAddLocation() {
            const query = document.getElementById('searchQuery').value.trim();
            const city = document.getElementById('searchCity').value.trim();
            const state = document.getElementById('searchState').value.trim();

            if (!query) {
                alert('Please enter a location name or address.');
                return;
            }

            let fullQuery = query;
            if (city) fullQuery += `, ${city}`;
            if (state) fullQuery += `, ${state}`;

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(fullQuery)}`);
                const data = await response.json();

                if (data.length === 0) {
                    alert('Location not found. Try refining your search or filters.');
                    return;
                }

                const place = data[0];
                const newLoc = {
                    name: place.display_name,
                    lat: parseFloat(place.lat),
                    lon: parseFloat(place.lon)
                };

                if (locations.length >= 200) {
                    alert('Maximum limit of 200 locations reached.');
                    return;
                }

                locations.push(newLoc);
                updateUI();
                
                // Clear query input for next entry
                document.getElementById('searchQuery').value = '';
            } catch (error) {
                console.error('Geocoding error:', error);
                alert('Error fetching location. Please check your network connection.');
            }
        }

        function removeLocation(index) {
            locations.splice(index, 1);
            updateUI();
        }

        function clearAllLocations() {
            locations = [];
            updateUI();
            if (routeLayer) map.removeLayer(routeLayer);
        }

        function updateUI() {
            const listEl = document.getElementById('locationList');
            document.getElementById('locationCount').innerText = locations.length;
            
            // Clear markers from map
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            if (locations.length === 0) {
                listEl.innerHTML = `<p class="text-gray-400 text-xs text-center mt-6">No locations added yet.</p>`;
                return;
            }

            let html = '';
            locations.forEach((loc, idx) => {
                html += `
                    <div class="flex justify-between items-center bg-white p-2 rounded border shadow-sm text-xs">
                        <span class="truncate flex-1 mr-2"><strong class="text-blue-600">${idx + 1}.</strong> ${loc.name}</span>
                        <button onclick="removeLocation(${idx})" class="text-red-500 hover:text-red-700 font-bold px-1">✕</button>
                    </div>
                `;

                // Add marker
                const marker = L.marker([loc.lat, loc.lon]).addTo(map)
                    .bindPopup(`<b>Stop ${idx + 1}</b><br>${loc.name}`);
                markers.push(marker);
            });

            listEl.innerHTML = html;

            // Fit map bounds to markers if any exist
            if (markers.length > 0) {
                const group = new L.featureGroup(markers);
                map.fitBounds(group.getBounds().pad(0.1));
            }
        }

        // Haversine formula to calculate straight-line distance (for fast TSP approximation)
        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function deg2rad(deg) {
            return deg * (Math.PI/180);
        }

        // Nearest Neighbor heuristic to solve TSP efficiently for up to 200 points
        function solveTSP(pts, isRoundTrip) {
            if (pts.length <= 2) return pts.map((_, i) => i);

            let unvisited = Array.from({length: pts.length}, (_, i) => i);
            let route = [];
            
            // Start with the first added location
            let currentIdx = unvisited.shift();
            route.push(currentIdx);

            while (unvisited.length > 0) {
                let nearestIdx = -1;
                let minDistance = Infinity;

                for (let i = 0; i < unvisited.length; i++) {
                    const candidateIdx = unvisited[i];
                    const dist = getDistanceFromLatLonInKm(
                        pts[currentIdx].lat, pts[currentIdx].lon,
                        pts[candidateIdx].lat, pts[candidateIdx].lon
                    );
                    if (dist < minDistance) {
                        minDistance = dist;
                        nearestIdx = i;
                    }
                }

                currentIdx = unvisited.splice(nearestIdx, 1)[0];
                route.push(currentIdx);
            }

            return route;
        }

        async function optimizeRoute() {
            if (locations.length < 3) {
                alert('Please add at least 3 locations to optimize a route.');
                return;
            }

            const isRoundTrip = document.getElementById('roundTrip').checked;
            const optimizedIndices = solveTSP(locations, isRoundTrip);
            
            let orderedLocations = optimizedIndices.map(i => locations[i]);
            if (isRoundTrip) {
                orderedLocations.push(orderedLocations[0]); // Complete loop back to start
            }

            // Construct OSRM Route URL
            const coordsString = orderedLocations.map(l => `${l.lon},${l.lat}`).join(';');
            const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coordsString}?overview=full&geometries=geojson`;

            try {
                const response = await fetch(osrmUrl);
                const data = await response.json();

                if (data.code !== 'Ok' || !data.routes.length) {
                    alert('Could not calculate driving route between points.');
                    return;
                }

                const route = data.routes[0];
                const distanceKm = (route.distance / 1000).toFixed(1);
                const distanceMiles = (distanceKm * 0.621371).toFixed(1);
                const durationMins = Math.round(route.duration / 60);

                // Display summary
                const summaryEl = document.getElementById('routeSummary');
                const summaryText = document.getElementById('summaryText');
                summaryEl.classList.remove('hidden');
                summaryText.innerHTML = `Total Distance: <b>${distanceMiles} miles</b> (${distanceKm} km)<br>Estimated Drive Time: <b>~${durationMins} minutes</b>`;

                // Draw route on map
                if (routeLayer) map.removeLayer(routeLayer);
                
                const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
                routeLayer = L.polyline(coords, { color: '#2563eb', weight: 5, opacity: 0.7 }).addTo(map);
                map.fitBounds(routeLayer.getBounds().pad(0.1));

            } catch (error) {
                console.error('Routing error:', error);
                alert('Error communicating with the routing service.');
            }
        }
    </script>
</body>
</html>
